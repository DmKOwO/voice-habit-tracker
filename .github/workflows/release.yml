name: Release APK

# Релизы публикуются в GitHub Releases этого репозитория (аккаунт DmKOwO).
# Запуск: ./release.sh 1.2.3  (создаёт и пушит тег v1.2.3)
# или вручную через Actions → Release APK → Run workflow.
#
# Обязательные секреты (Settings → Secrets → Actions) для подписанных OTA:
#   KEYSTORE_BASE64  — keystore в base64 (keytool -genkeypair ... | base64 -w0)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Без них тег-релиз падает: ключ подписи НЕ хранится в репозитории и не может
# быть восстановлен из него (см. ROTATION.md — старый ключ был публичным).
#
# Ключи ИИ (GROQ_API_KEY / GEMINI_API_KEY) здесь больше НЕ используются и не
# должны добавляться: они попадали в classes.dex каждого опубликованного APK
# и извлекались из него через `strings`. Приложение работает без них —
# вводите свой ключ в Настройках или пользуйтесь офлайн-парсером.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v1.2.0). Пусто — сборка без публикации."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate SemVer tag
        if: steps.tag.outputs.value != ''
        run: |
          if ! echo "${{ steps.tag.outputs.value }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Тег '${{ steps.tag.outputs.value }}' не SemVer (ожидается vX.Y.Z)"
            exit 1
          fi

      # Версия берётся из тега: v1.2.3 → versionName=1.2.3.
      # versionCode = номер запуска + 100: запас выше любых локальных сборок
      # (локальные идут с versionCode=1), иначе первая OTA не встанет.
      # Без этого OTA не видит обновление: checker сравнивает versionName,
      # а установщик Android — versionCode.
      - name: Derive version from tag
        id: version
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if [ -n "$TAG" ]; then
            VER="${TAG#v}"
            VER="${VER%%+*}"
          else
            VER="0.0.${{ github.run_number }}"
          fi
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"
          echo "Version: name=$VER code=$(( ${{ github.run_number }} + 100 ))"

      # Ключ подписи берётся ТОЛЬКО из секрета. Раньше здесь был fallback на
      # android/app/keystore/release.jks, лежавший в публичном репозитории, —
      # то есть любой мог подписать APK, который телефон примет как обновление.
      - name: Prepare keystore (signed OTA)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан. Без него релиз не собрать:"
            echo "::error::ключ подписи намеренно не хранится в репозитории."
            echo "::error::Создайте ключ и сохраните секрет — см. ROTATION.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/release.jks
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "Keystore из секрета готов."

      # Гейт: релиз не публикуется, если падают unit-тесты. Раньше в CI не было
      # ни одного шага тестов, и зелёный тег всегда публиковал APK.
      # Секреты подписи нужны и здесь: signingConfig вычисляется на этапе
      # конфигурации Gradle для любой задачи, иначе упадёт с «нет параметров».
      - name: Run unit tests
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Lint
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lintDebug --no-daemon --console=plain

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain -PversionName="${{ steps.version.outputs.name }}" -PversionCode="${{ steps.version.outputs.code }}"

      - name: Verify APK is signed
        run: |
          APK=$(ls android/app/build/outputs/apk/release/app-release*.apk | head -n 1)
          echo "APK: $APK"
          jarsigner -verify "$APK" | head -n 5
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"

      - name: Rename APK with version
        id: apk
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          TAG="${{ steps.tag.outputs.value }}"
          if [ -z "$TAG" ]; then TAG="manual-${{ github.run_number }}"; fi
          DST="voice-habit-tracker-${TAG}.apk"
          cp "$SRC" "$DST"
          sha256sum "$DST" | tee "$DST.sha256"
          echo "path=$DST" >> "$GITHUB_OUTPUT"
          echo "checksum=$DST.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.checksum }}

      - name: Create GitHub Release
        if: steps.tag.outputs.value != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Voice Habit Tracker ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.checksum }}
